<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e40af" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0f172a" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Inner Badge / Circle -->
  <g filter="url(#shadow)">
    <circle cx="256" cy="256" r="180" fill="#ffffff" fill-opacity="0.12" stroke="#ffffff" stroke-width="6" stroke-opacity="0.25" />
  </g>

  <!-- Left: Ge'ez 'አ' (Amharic) -->
  <text x="180" y="240" font-family="-apple-system, BlinkMacSystemFont, 'Noto Sans Ethiopic', 'Nyala', 'Abyssinica SIL', sans-serif" font-size="115" font-weight="bold" fill="#ffffff" text-anchor="middle" dominant-baseline="middle">አ</text>

  <!-- Right: Latin 'A' (English & Afan Oromo) -->
  <text x="330" y="325" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" font-size="120" font-weight="900" fill="#facc15" text-anchor="middle" dominant-baseline="middle">A</text>

  <!-- Central Bidirectional Arrows -->
  <g stroke="#ffffff" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Top arrow: Left to Right -->
    <path d="M 220 185 L 290 185 M 275 170 L 292 185 L 275 200" />
    <!-- Bottom arrow: Right to Left -->
    <path d="M 292 375 L 222 375 M 237 360 L 220 375 L 237 390" />
  </g>

  <!-- Subtle Offline Signal / Sync Indicator Badge -->
  <g transform="translate(256, 275)">
    <circle cx="0" cy="0" r="18" fill="#10b981" stroke="#ffffff" stroke-width="4" />
    <path d="M -6 0 L -2 4 L 7 -5" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  </g>
</svg>
